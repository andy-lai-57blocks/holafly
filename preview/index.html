<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holafly — Playable Creative Preview</title>
<style>__STYLE__</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="brand-mark" src="__LOGO__" alt="Holafly">
    <div class="brand-text">
      <strong>Playable Creatives</strong>
      <span>Three concepts · English build</span>
    </div>
  </div>

  <div class="toolbar">
    <div class="seg" id="device-seg" role="group" aria-label="Device"></div>
    <button class="btn" id="rotate" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.3 4.2a9 9 0 1 1-3.1 8.3h2.1a7 7 0 1 0 2.3-6.2L11 8.7H4.5V2.2l2.8 2z"/></svg>
      <span id="rotate-label">Portrait</span>
    </button>
    <button class="btn" id="reload" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2.2L7.9 5.9 12 9.6V6.8a5.4 5.4 0 1 1-5.4 5.4H4.8A7.2 7.2 0 1 0 12 5z"/></svg>
      <span>Restart</span>
    </button>
    <button class="btn" id="fill" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zM3 14h2v5h5v2H3v-7zm16 0h2v7h-7v-2h5v-5z"/></svg>
      <span>Fill screen</span>
    </button>
    <a class="btn" id="popout" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14V3zM5 5h5v2H7v10h10v-3h2v5H5V5z"/></svg>
      <span>Full tab</span>
    </a>
  </div>
</header>

<!-- Fill-screen mode hands the creative the real device viewport with no bezel,
     which is the only way to judge on a tablet whether it uses the whole slot.
     The device mockups above are always a scaled-down box by design. -->
<button class="fill-exit" id="fill-exit" type="button" hidden>Exit full screen</button>

<main class="layout">
  <nav class="versions" id="versions" aria-label="Versions"></nav>

  <section class="stage" id="stage">
    <div class="stage-inner">
      <div class="device" id="device">
        <div class="bezel">
          <div class="island" aria-hidden="true"></div>
          <iframe id="frame" title="Playable preview" allow="autoplay; fullscreen"
                  sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
          <div class="indicator" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <p class="stage-note" id="stage-note"></p>
  </section>

  <aside class="panel">
    <div class="card">
      <h2>Open on your phone</h2>
      <p class="muted">Scan with the camera app. The creative runs exactly as it will in the ad slot.</p>
      <div class="qr"><canvas id="qr" width="512" height="512"></canvas></div>
      <code class="url" id="qr-url"></code>
      <p class="warn" id="qr-warn" hidden></p>
    </div>

    <div class="card">
      <h2 id="meta-title"></h2>
      <p class="muted" id="meta-desc"></p>
      <dl class="meta" id="meta-files"></dl>
    </div>
  </aside>
</main>

<script>__QRCODE__</script>
<script>__VERSIONS__</script>
<script>__SCRIPT__</script>
</body>
</html>
