<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>__APP_NAME__</title>
<style>__FONT_FACES__</style>
<style>__STYLE__</style>
</head>
<body>
<div id="playable-root">
  <div id="stage">
    <div id="game-canvas-container"><canvas id="game"></canvas></div>

    <div id="ui-layer">
      <div id="hud">
        <img id="hud-wordmark" alt="">
        <div id="hud-readouts">
          <div class="pill" id="meter-pill">
            <span id="meter-bars" aria-hidden="true">
              <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
            </span>
            <span class="label" id="meter-label"></span>
            <span id="meter-num">0%</span>
          </div>
          <div class="pill" id="dest-pill">
            <span class="label" id="dest-label"></span>
            <span id="dest-count">0</span>
          </div>
        </div>
      </div>

      <div id="live-cta-wrap">
        <button id="live-cta" class="cta" type="button" data-stop-tap></button>
      </div>

      <div id="hook-overlay">
        <span class="hl" id="hook-headline"></span>
        <span class="hl" id="hook-headline-sub"></span>
      </div>

      <div id="banner" role="status"></div>

      <div id="idle-hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.1 2.6a1.6 1.6 0 0 1 3.2 0v8.5h.9V9.2a1.5 1.5 0 0 1 3 0v1.9h.9v-1a1.5 1.5 0 0 1 3 0v6.3c0 3.2-2.3 5.3-5.6 5.3h-1.6c-2 0-3.3-.7-4.4-2.3l-3.8-5.3c-.6-.9-.3-2 .6-2.6.8-.5 1.9-.3 2.5.5l1.3 1.7V2.6z"/></svg>
        <span id="idle-hint-text"></span>
      </div>
    </div>
  </div>

  <div id="endcard" hidden>
    <img id="end-wordmark" alt="">
    <div id="end-card-body">
      <div id="end-head">
        <span class="hl" id="end-headline"></span>
        <span class="hl" id="end-headline-sub"></span>
      </div>
      <p id="end-body"></p>
      <div id="end-stats">
        <div class="stat">
          <span class="stat-value" id="stat-dest-value">0</span>
          <span class="stat-label" id="stat-dest-label"></span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-data-value">0</span>
          <span class="stat-label" id="stat-data-label"></span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-uptime-value">0%</span>
          <span class="stat-label" id="stat-uptime-label"></span>
        </div>
      </div>
      <div id="end-cta-row">
        <img id="end-logo" alt="">
        <button id="end-cta" class="cta" type="button" data-stop-tap></button>
      </div>
      <button id="end-replay" type="button" data-stop-tap>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2.2L7.9 5.9 12 9.6V6.8a5.4 5.4 0 1 1-5.4 5.4H4.8A7.2 7.2 0 1 0 12 5z"/></svg>
        <span id="end-replay-text"></span>
      </button>
    </div>
    <p id="legal"></p>
  </div>
</div>

<script>__CONFIG__</script>
<script>__SCRIPTS__</script>
</body>
</html>
