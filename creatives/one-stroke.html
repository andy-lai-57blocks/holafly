<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="ad.size" content="width=320,height=480">
<script src="mraid.js"></script>
<title>Holafly One Stroke</title>
<style>

/* ---------- Brand tokens ----------
   Modern Era is Holafly's licensed brand face. RULE-PRF-001 forbids runtime requests,
   so inline the licensed woff2 files as base64 data URIs here (no url('file.woff2')).
   Until then the system sans stack below is the fallback. */
/*
@font-face{font-family:'Modern Era';src:url('data:font/woff2;base64,...') format('woff2');font-weight:500}
@font-face{font-family:'Modern Era';src:url('data:font/woff2;base64,...') format('woff2');font-weight:700 800}
*/
:root{
  --hf-blue:#1e3dff; --hf-blue-deep:#1428b8; --hf-pink:#e6485c; --hf-violet:#6a4cff;
  --hf-red:#e12b57; --hf-red-2:#c8094e; /* brand button gradient stops */
  --hf-logo:#e6485c; /* red sampled from the official logo */
  --g0:#bfebff; --g1:#f9eef8; --g2:#ffccb0; /* brand gradient stops 0% / 49% / 100% */
  --wave:#8ff0ff; --ink:#0f1a4d; --ink-2:#4a5a8f; --paper:#ffffff;
  --bad:#ff4d6d; --good:#48ec86; --lm:#9aa8c7;
  --font:'Modern Era',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,var(--g0) 0%,var(--g1) 49%,var(--g2) 100%);font-family:var(--font);color:var(--ink);
  display:flex;justify-content:center;align-items:center;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
/* the stage fills its slot on every device; an ad should never letterbox itself
   inside the container it was given. Tablet rules further down keep the map at
   its authored aspect so the extra room becomes layout, not stretching. */
.stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-sizing:border-box;gap:8px;touch-action:none}
/* persistent in-game CTA (RULE-CVR-007) */
.copy{display:flex;flex-direction:row;align-items:center;gap:10px}
.copy .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cta-mini{flex:none;appearance:none;border:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;min-height:44px;min-width:44px;padding:0 14px;font:inherit;font-weight:800;font-size:12.5px;color:#fff;background:linear-gradient(90deg,var(--hf-red) 0%,var(--hf-red-2) 100%);box-shadow:0 6px 16px rgba(200,9,78,.25);cursor:pointer;white-space:nowrap}
.cta-mini:focus-visible{outline:3px solid var(--hf-blue);outline-offset:2px}
/* pause state: freeze animations when the ad is not viewable (RULE-MRD-003) */
.paused *,.paused *::before,.paused *::after{animation-play-state:paused!important;transition:none!important}
/* No desktop "phone card" treatment. It used to cap the stage at 430px behind
   a (hover:hover) and (pointer:fine) guard, on the assumption that only a
   desktop would match. An iframe inherits the *host's* pointer capabilities,
   not its own size, so previewing an 834px-wide iPad on a laptop still matched
   and the tablet layout never ran. An ad fills the slot it is given; the
   device mockup belongs to the preview shell, which draws its own bezel. */

/* top bar */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:34px} /* logo left, chips dead-centre, right third left empty for the SDK close button (~50×50) */
.bar .logo{justify-self:start}
.bar .chips{justify-self:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1}
.logo img{height:26px;width:auto;max-width:none;display:block} /* the host reset sets img{max-width:100%}, which squashed the logo inside the narrow grid column */
.chips{display:flex;gap:8px;align-items:center;white-space:nowrap}
.chips .dot{opacity:.45}
.bar{column-gap:12px}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.55);border:1px solid rgba(15,26,77,.12);color:var(--ink);border-radius:999px;padding:5px 10px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
#chipRoutes.warn{color:var(--hf-red)}
/* map panel */
.panel{position:relative;flex:1;min-height:0;border-radius:22px;background:rgba(255,255,255,.92);box-shadow:0 16px 44px rgba(30,61,255,.14), inset 0 0 0 1px rgba(255,255,255,.9);overflow:hidden}
.panel svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.land{fill:#dbe6fb;stroke:#ffffff;stroke-width:.9;stroke-linejoin:round}
.edge{stroke:#5b6cb8;stroke-opacity:.45;stroke-width:3;stroke-dasharray:4 6;stroke-linecap:round;fill:none;transition:stroke-opacity .4s}
.edge.lit{stroke:var(--good);stroke-opacity:.7;stroke-dasharray:none;stroke-width:5;filter:drop-shadow(0 0 4px rgba(72,236,134,.45))}
.edge.hint{stroke:var(--hf-pink);stroke-opacity:.9;stroke-dasharray:4 6;animation:hintpulse 1s ease-in-out infinite}
.edge.bad{stroke:var(--bad);stroke-opacity:1;stroke-dasharray:none;stroke-width:5}
.edge.fade{stroke-opacity:.15}
.wave{stroke:#ffffff;stroke-width:2;stroke-linecap:round;fill:none;stroke-dasharray:6 14;pointer-events:none;opacity:0}
.wave.on{opacity:.95;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes hintpulse{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.rubber{stroke:var(--hf-blue);stroke-width:5;stroke-linecap:round;stroke-opacity:.55;fill:none;pointer-events:none}
.node{fill:#fff;stroke:var(--hf-blue);stroke-width:3.5;transition:fill .25s,stroke .25s,r .2s}
.node.done{fill:var(--good);stroke:var(--good)}
.node.cur{fill:var(--hf-pink);stroke:#fff;filter:drop-shadow(0 0 6px rgba(230,72,92,.8))}
.node.bad{fill:var(--bad);stroke:#fff}
.hit{fill:transparent;pointer-events:all}
.ring{fill:none;stroke:var(--hf-blue);stroke-width:2;opacity:0;pointer-events:none}
.ring.on{animation:ring 1.4s ease-out infinite}
.ring.pink{stroke:var(--hf-pink);stroke-width:2.5}
.label.start{fill:var(--hf-pink);font-size:11.5px}
@keyframes ring{0%{r:12;opacity:.6}100%{r:28;opacity:0}}
.label{font-family:var(--font);font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;letter-spacing:.01em}
.start-tag{font-family:var(--font);font-size:9px;font-weight:800;letter-spacing:.12em;fill:var(--hf-pink);paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none;opacity:0;transition:opacity .3s}
.start-tag.on{opacity:1}
.landmark{pointer-events:none;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.landmark.show{animation:lm 1.9s ease-out forwards}
@keyframes lm{0%{opacity:0;transform:translateY(8px) scale(.85)}22%{opacity:.95;transform:translateY(0) scale(1)}70%{opacity:.9}100%{opacity:0;transform:translateY(-8px) scale(1.02)}}
.lm-shape{fill:var(--lm);fill-opacity:1}
.lm-shape.light{fill:#fff;fill-opacity:1}
.toast{position:absolute;left:50%;top:44px;transform:translate(-50%,-6px);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:9px 16px;border-radius:999px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(15,26,77,.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;letter-spacing:.02em}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad)}
.toast.good{background:var(--good);color:#0b3d22}
.toast .sig{display:inline-flex;align-items:flex-end;gap:2px;height:13px;flex:none}
.toast .sig i{display:block;width:3px;border-radius:1px;background:currentColor;animation:sigup .5s ease-out both}
.toast .sig i:nth-child(1){height:4px}.toast .sig i:nth-child(2){height:7px;animation-delay:.08s}.toast .sig i:nth-child(3){height:10px;animation-delay:.16s}.toast .sig i:nth-child(4){height:13px;animation-delay:.24s}
@keyframes sigup{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.toast .g5{font-size:11px;font-weight:800;letter-spacing:.04em;background:rgba(255,255,255,.18);border-radius:5px;padding:1px 5px;flex:none}
/* bottom copy */
.copy{min-height:78px;padding:2px 4px}
.copy h1{margin:0;font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.025em;white-space:nowrap}
.copy h1.wrap{white-space:normal}
.copy p{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.timer{height:4px;border-radius:2px;background:rgba(15,26,77,.10);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--hf-blue),var(--good));transform-origin:left;transform:scaleX(0)}
.timer.run i{transition:transform var(--dur,22s) linear;transform:scaleX(1)}
/* end page */
.end{position:absolute;inset:0;background:transparent;display:flex;flex-direction:column;align-items:center;padding:calc(6px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow:visible;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .45s;z-index:5}
.end.on{opacity:1;pointer-events:auto}
.stage.ended .bar,.stage.ended .panel,.stage.ended .copy,.stage.ended .timer{visibility:hidden}
.end .cloud{position:absolute;pointer-events:none;width:auto}
.end .c1{right:calc(-16% - 40px);top:9%;width:78%}                    /* big, right */
.end .c2{left:50%;top:0;width:44%;transform:translateX(-50%)} /* top centre, smaller */
.end .c3{left:calc(-8% + 40px);top:calc(31% - 90px);width:46%;transform:scaleX(-1)}  /* lower left, behind the phone */
.end .hero{position:relative;width:100%;flex:0 0 auto;height:min(46%,370px);display:flex;justify-content:center;align-items:flex-end;z-index:1;margin-top:calc(2% + 24px)}
.end .hero img{height:100%;width:auto;display:block;transform:translateX(4%)}
.end.on .hero img{animation:endpop .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes endpop{from{opacity:0;transform:translate(4%,14px)}to{opacity:1;transform:translate(4%,0)}}
.end .card{position:relative;z-index:2;width:100%;margin-top:calc(-1 * min(30%,240px) - 10px);border:3px solid transparent;border-radius:18px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,var(--g2) 0%,var(--g1) 51%,var(--g0) 100%) border-box;box-shadow:0 14px 40px rgba(30,61,255,.10);padding:34px 22px 30px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.end .stat{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hf-blue)}
.end .big em{font-style:normal;color:var(--hf-logo)}
.end .big{font-size:25px;font-weight:800;line-height:1.12;letter-spacing:-.03em;text-wrap:balance;margin:2px 0 0;max-width:16ch}
.end .line{margin:0;font-size:14px;font-weight:600;color:var(--ink-2);max-width:30ch;line-height:1.45}
.end .trust{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:18px;text-wrap:balance}
.btn{appearance:none;border:0;display:block;text-align:center;text-decoration:none;box-sizing:border-box;border-radius:999px;padding:14px 26px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;width:100%;margin-top:6px;letter-spacing:-.01em}
.btn.primary{background:linear-gradient(90deg,var(--hf-red) 0%,var(--hf-red-2) 100%);color:#fff;box-shadow:0 8px 22px rgba(200,9,78,.28);margin-top:24px}
/* light sweep top→bottom on the primary CTA (paused with the rest when the ad is hidden) */
.btn.primary{position:relative;overflow:hidden;isolation:isolate}
.btn.primary::after{content:"";position:absolute;left:-10%;right:-10%;top:0;height:40%;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent);
  animation:sheen 4.2s ease-in-out infinite} /* 2.6 s sweep + ~1.6 s rest */
@keyframes sheen{0%{transform:translateY(-60%)}62%{transform:translateY(260%)}100%{transform:translateY(260%)}}
@media (prefers-reduced-motion:reduce){.btn.primary::after{animation:none;display:none}}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid rgba(15,26,77,.18);margin-top:4px}
.btn:focus-visible{outline:3px solid var(--hf-blue);outline-offset:2px}
.end .legal{font-size:11px;line-height:1.4;color:#4a5a8f;max-width:none;text-wrap:balance}
@media (max-height:640px){.end .hero{height:46%}.end .card{margin-top:calc(-1 * min(22%,150px));padding:24px 18px 20px;gap:8px}.end .big{font-size:23px}.btn{padding:12px 22px}.btn.primary{margin-top:14px}.end .trust{margin-top:10px}}
.panel svg.hand{position:absolute;inset:auto;width:34px;height:34px;pointer-events:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 2px 4px rgba(15,26,77,.35))}
.panel svg.hand path{stroke:var(--ink)}
.panel svg.hand.on{opacity:1;animation:hand 1.6s ease-in-out infinite}
@keyframes hand{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-10px)}}
@media (prefers-reduced-motion:reduce){.wave.on,.ring.on,.edge.hint,.hand.on{animation:none}.landmark.show{animation-duration:.01s;opacity:0}}
/* landscape (RULE-PRF-007) */
@media (orientation:landscape) and (max-height:520px){
  .stage{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,34%);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar bar" "panel copy" "timer timer";column-gap:16px}
  .bar{grid-area:bar}.panel{grid-area:panel}.copy{grid-area:copy;flex-direction:column;align-items:flex-start;justify-content:center}.timer{grid-area:timer}
  .copy h1{font-size:20px}.cta-mini{align-self:stretch;margin-top:8px}
  .end{flex-direction:row;align-items:center;justify-content:center;gap:12px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .end .hero{height:90%;width:auto;flex:0 0 36%;margin:0;align-items:center;justify-content:flex-end}
  .end .hero img{transform:none}
  .end .card{width:auto;flex:1 1 auto;min-width:0;max-width:440px;max-height:96%;overflow:auto;margin-top:0;padding:16px 18px 14px;gap:5px}
  .end .legal{max-width:none}
  .end .big{font-size:22px}.btn{padding:11px 20px}.btn.primary{margin-top:10px}.end .trust{margin-top:8px}.end .c3{display:none}
}


/* ---------- tablet: portrait ----------
   The panel takes all the room going. fitViewBox() widens the map's viewBox
   around the cities' bounding box once the panel is squarer than 0.8, so the
   board fills the space by revealing more map rather than by cropping it. */
@media (min-width:560px) and (orientation:portrait){
  .stage{gap:16px;padding:calc(26px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(26px,env(safe-area-inset-left,0px))}
  .panel{flex:1 1 0;min-height:0;border-radius:30px}
  .bar{min-height:46px}
  .logo{font-size:30px}
  .logo img{height:34px}
  .chip{font-size:14px;padding:7px 15px}
  .copy{min-height:104px;gap:18px}
  .copy h1{font-size:31px}
  .copy p{font-size:17px}
  .cta-mini{font-size:17px;min-height:56px;padding:0 26px}
  .timer{height:6px}
  .toast{font-size:18px;padding:12px 22px;top:60px}
}

/* ---------- tablet: landscape ----------
   A single tall column would leave most of the width empty, so the map sits
   beside the copy instead of above it. The map column takes the larger share:
   the board is the thing being sold, and a wide panel is what pushes the
   aspect past fitViewBox()'s 0.8 threshold so the map fills it. */
@media (orientation:landscape) and (min-width:700px) and (min-height:560px){
  .stage{display:grid;
    grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);
    grid-template-rows:auto 1fr auto;
    grid-template-areas:"panel bar" "panel copy" "panel timer";
    column-gap:34px;row-gap:14px;
    padding:calc(22px + env(safe-area-inset-top,0px)) max(30px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(26px,env(safe-area-inset-left,0px))}
  .bar{grid-area:bar;min-height:46px}
  .panel{grid-area:panel;width:100%;height:100%;border-radius:30px}
  .copy{grid-area:copy;flex-direction:column;align-items:flex-start;justify-content:center;gap:20px;min-height:0}
  .copy .txt{flex:0 0 auto;gap:8px}
  .copy h1{font-size:clamp(28px,3.4vw,42px);white-space:normal}
  .copy p{font-size:clamp(15px,1.5vw,20px)}
  .cta-mini{align-self:flex-start;font-size:18px;min-height:60px;padding:0 30px}
  .timer{grid-area:timer;align-self:end;height:6px}
  .logo{font-size:32px}
  .logo img{height:36px}
  .chip{font-size:14px;padding:7px 15px}
  .toast{font-size:18px;padding:12px 22px;top:60px}
  /* the endcard covers the whole stage, so it gets the wide treatment too */
  .end{flex-direction:row;align-items:center;justify-content:center;gap:34px;padding:calc(20px + env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(40px,env(safe-area-inset-left,0px))}
  .end .hero{height:82%;width:auto;flex:0 0 38%;margin:0;align-items:center;justify-content:flex-end}
  .end .hero img{transform:none}
  .end .card{width:auto;flex:1 1 auto;min-width:0;max-width:520px;margin-top:0;padding:30px 32px 26px;gap:8px}
  .end .big{font-size:34px;max-width:18ch}
  .end .line{font-size:17px;max-width:34ch}
  .end .stat{font-size:15px}
  .end .trust{font-size:14px;margin-top:14px}
  .end .legal{font-size:12px}
  .btn{padding:16px 30px;font-size:18px}
  .end .c3{display:none}
}
</style>
</head>
<body>


<div class="stage" id="stage">
  <div class="bar">
    <div class="logo"><img id="logo" alt="" src="" width="83" height="26"></div>
    <div class="chips chip"><span id="chipMap"></span><span class="dot" aria-hidden="true">·</span><span id="chipRoutes"></span></div>
  </div>

  <div class="panel" id="panel">
    <svg id="svg" viewBox="0 0 390 560" preserveAspectRatio="xMidYMid slice" aria-label="One-stroke map puzzle">
      <defs>
        <!-- landmark symbols: simple silhouettes, 60x60 box, baseline at y=60 -->
        <symbol id="lm-lisbon" viewBox="0 0 60 60"><rect class="lm-shape" x="18" y="32" width="24" height="28" rx="2"/><rect class="lm-shape" x="24" y="16" width="12" height="18"/><rect class="lm-shape" x="24" y="11" width="3" height="5"/><rect class="lm-shape" x="33" y="11" width="3" height="5"/><rect class="lm-shape" x="13" y="28" width="5" height="12" rx="1"/><rect class="lm-shape" x="42" y="28" width="5" height="12" rx="1"/><rect class="lm-shape light" x="28" y="22" width="4" height="7" rx="2"/><rect class="lm-shape light" x="22" y="40" width="4" height="8" rx="2"/><rect class="lm-shape light" x="34" y="40" width="4" height="8" rx="2"/></symbol>
<symbol id="lm-madrid" viewBox="0 0 60 60"><rect class="lm-shape" x="6" y="30" width="48" height="30"/><rect class="lm-shape" x="4" y="24" width="52" height="7" rx="1"/><rect class="lm-shape" x="20" y="12" width="20" height="12" rx="1"/><rect class="lm-shape" x="26" y="7" width="8" height="5"/><path class="lm-shape light" d="M12 60V44a5 5 0 0 1 10 0v16zM25 60V42a5 5 0 0 1 10 0v18zM38 60V44a5 5 0 0 1 10 0v16z"/></symbol>
<symbol id="lm-barcelona" viewBox="0 0 60 60"><path class="lm-shape" d="M8 60 L13 18 L18 60Z M19 60 L25 8 L31 60Z M32 60 L37 14 L42 60Z M43 60 L48 22 L53 60Z"/><circle class="lm-shape light" cx="25" cy="30" r="1.6"/><circle class="lm-shape light" cx="13" cy="38" r="1.4"/><circle class="lm-shape light" cx="37" cy="34" r="1.4"/><circle class="lm-shape light" cx="48" cy="40" r="1.3"/></symbol>

function canFinishFrom(node, remaining){ if(!remaining.length) return true; const touched=new Set(); remaining.forEach(([a,b])=>{touched.add(a);touched.add(b);}); if(!touched.has(node)) return false; const reach=connectedVia(remaining,node); for(const n of touched) if(!reach.has(n)) return false; const deg={}; remaining.forEach(([a,b])=>{deg[a]=(deg[a]||0)+1;deg[b]=(deg[b]||0)+1;}); const odd=Object.keys(deg).filter(n=>deg[n]%2); return odd.length===0 || (odd.length===2 && odd.includes(node)); }
function adjacency(nodes, edges){ const adj={}; nodes.forEach(n=>adj[n]=[]); edges.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a);}); return adj; }
function hamPathFrom(start, visitedSet){ const adj=adjacency(M.nodes,M.edges); const seen=new Set(visitedSet); seen.add(start); const path=[start]; const N=M.nodes.length; function dfs(u){ if(seen.size===N) return true; for(const v of adj[u]){ if(seen.has(v)) continue; seen.add(v); path.push(v); if(dfs(v)) return true; seen.delete(v); path.pop(); } return false; } return dfs(start)? path : null; }
function hamStarts(){ return M.nodes.filter(n=>hamPathFrom(n,new Set([n]))); }
function isComplete(){ return CITY_MODE ? visited.size===M.nodes.length : done.size===M.edges.length; }
function eulerPath(nodes, edges){ const deg=degrees(nodes,edges); const odd=nodes.filter(n=>deg[n]%2); const start = odd.length? odd[0] : nodes[0]; const adj={}; nodes.forEach(n=>adj[n]=[]); edges.forEach(([a,b],i)=>{adj[a].push({to:b,i});adj[b].push({to:a,i});}); const used=new Array(edges.length).fill(false), stack=[start], path=[]; while(stack.length){ const u=stack[stack.length-1]; let moved=false; while(adj[u].length){ const e=adj[u].pop(); if(used[e.i]) continue; used[e.i]=true; stack.push(e.to); moved=true; break; } if(!moved) path.push(stack.pop()); } return path.reverse(); }

/* ---------------- state ---------------- */
const tiers={easy:0,standard:1,advanced:2}; const firstTier=tiers[G.difficultyLevel]||0;
const easyMaps=shuffle(MAPS.filter(m=>m.level==='easy'));
let order = easyMaps.slice(0,1).concat(shuffle(MAPS.filter(m=>m.level==='standard')), MAPS.filter(m=>m.level==='advanced'), easyMaps.slice(1)); // one warm-up map, then the real puzzles
order = order.filter(m=>tiers[m.level]>=firstTier).concat(order.filter(m=>tiers[m.level]<firstTier));
let mapIdx=0, M=null, pos=null, edgeEls={}, waveEls={}, nodeEls={}, ringEls={}, startTags={};
let done=new Set(), visited=new Set(), cur=null, dragging=false, drops=0, started=false, finished=false, startTs=0, firstTouch=null, autoPlayed=false;
/* pausable timers (RULE-MRD-003/004) */
const timers={}; let paused=false;
function setT(name, fn, ms){ clearT(name); timers[name]={fn,remaining:ms,startedAt:Date.now(),id:setTimeout(()=>{delete timers[name];fn();},ms)}; }
function clearT(name){ if(timers[name]){ clearTimeout(timers[name].id); delete timers[name]; } }
function pauseAll(){ if(paused) return; paused=true; stage.classList.add('paused'); for(const k in timers){ const t=timers[k]; clearTimeout(t.id); t.remaining=Math.max(0,t.remaining-(Date.now()-t.startedAt)); } if(started&&!finished) timerEl.classList.remove('run'); track('pause'); }
function resumeAll(){ if(!paused) return; paused=false; stage.classList.remove('paused'); for(const k in timers){ const t=timers[k]; t.startedAt=Date.now(); t.id=setTimeout(()=>{delete timers[k];t.fn();},t.remaining); } if(started&&!finished) timerEl.classList.add('run'); track('resume'); }

function loadMap(i){
  mapIdx=i; M=order[i]; pos=M.pos;
  done=new Set(); visited=new Set(); cur=null; dragging=false; drops=0; started=false; finished=false; autoPlayed=false;
  ['limit','hint','idleHint','idleAuto'].forEach(clearT); timerEl.classList.remove('run'); void timerEl.offsetWidth;
  endEl.classList.remove('on'); stage.classList.remove('ended');
  mapG.setAttribute('transform',`translate(${M.view.tx} ${M.view.ty}) scale(${M.view.s})`);
  edgesG.innerHTML=''; wavesG.innerHTML=''; nodesG.innerHTML=''; labelsG.innerHTML=''; lmG.innerHTML='';
  edgeEls={}; waveEls={}; nodeEls={}; ringEls={}; startTags={}; placedLabels=[];
  M.edges.forEach(([a,b])=>{ const k=key(a,b);
    edgeEls[k]=el('line',{class:'edge',x1:pos[a][0],y1:pos[a][1],x2:pos[b][0],y2:pos[b][1]},edgesG);
    waveEls[k]=el('line',{class:'wave',x1:pos[a][0],y1:pos[a][1],x2:pos[b][0],y2:pos[b][1]},wavesG); });
  M.nodes.forEach(n=>{ const [x,y]=pos[n];
    const lm=LANDMARK_FOR[n]; if(lm){ el('use',{href:'#lm-'+lm,class:'landmark',id:'lm_'+n,x:x-22,y:y-58,width:44,height:44},lmG); }
    ringEls[n]=el('circle',{class:'ring',cx:x,cy:y,r:12},nodesG);
    nodeEls[n]=el('circle',{class:'node',cx:x,cy:y,r:10,'data-n':n},nodesG);
    el('circle',{class:'hit',cx:x,cy:y,r:HIT_R,'data-n':n},nodesG);
    const side = labelSide(n); const t=el('text',{class:'label',x:x,y:side==='above'?y-18:y+26,'text-anchor':'middle'},labelsG); t.textContent=n; startTags[n]=t; });
  const deg=degrees(M.nodes,M.edges); const odd=M.nodes.filter(n=>deg[n]%2);
  M.startCandidates = CITY_MODE ? hamStarts() : (odd.length? odd : M.nodes.slice());
  fitViewBox(); showStartHints(true);
  $('chipMap').textContent=fmt(T.chipMap,{i:i+1,n:order.length}); updateRoutes(); $('chipRoutes').classList.remove('warn');
  setCopy(CITY_MODE?T.headline:T.headlineRoutes, CITY_MODE?T.hookSub:T.hookSubRoutes);
  hideHand();
  setT('idleHint', ()=>placeHand(M.startCandidates[0]), IDLE_HINT_MS);          // RULE-CVR-003
  if(!firstTouch) setT('idleAuto', autoFinish, IDLE_AUTOPLAY_MS);
  track('map_load',{map_id:M.id,level:M.level,nodes:M.nodes.length,edges:M.edges.length,locale:LOCALE});
}
/* progressive start hints: 0 drops → all cities pulse (generic affordance); ≥1 drop → only valid starts pulse; ≥2 drops → START labels */
/* keep every city in view whatever the panel's aspect (phone landscape, tablets): widen the viewBox around the cities' bounding box (RULE-PRF-007) */
const LAND_EXTENT={x0:-300,y0:-150,x1:690,y1:710};
function fitViewBox(){ if(!M) return; const pr=$('panel').getBoundingClientRect(); if(pr.width<10||pr.height<10) return; const a=pr.width/pr.height;
  const xs=M.nodes.map(n=>pos[n][0]), ys=M.nodes.map(n=>pos[n][1]); const pad=64;
  const bw=Math.max(...xs)-Math.min(...xs)+pad*2, bh=Math.max(...ys)-Math.min(...ys)+pad*2; const cx=(Math.max(...xs)+Math.min(...xs))/2, cy=(Math.max(...ys)+Math.min(...ys))/2;
  let W,H; if(a<0.8){ W=390; H=560; svg.setAttribute('viewBox','0 0 390 560'); svg.setAttribute('preserveAspectRatio','xMidYMid slice'); return; }
  W=Math.max(bw, bh*a, 390); H=W/a; if(H<bh){ H=bh; W=H*a; }
  let x=cx-W/2, y=cy-H/2; x=Math.max(LAND_EXTENT.x0, Math.min(x, LAND_EXTENT.x1-W)); y=Math.max(LAND_EXTENT.y0, Math.min(y, LAND_EXTENT.y1-H));
  svg.setAttribute('viewBox',`${x.toFixed(1)} ${y.toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}`); svg.setAttribute('preserveAspectRatio','xMidYMid meet'); }
function showStartHints(on){
  const reveal = drops>=1, label = drops>=(G.hintAfterDrops||2);
  M.nodes.forEach(n=>{ const cand=M.startCandidates.includes(n);
    ringEls[n].classList.toggle('on', on && (cand || !reveal));
    ringEls[n].classList.toggle('pink', on && reveal && cand);
    startTags[n].classList.toggle('start', on && label && cand);
    startTags[n].textContent = (on && label && cand) ? fmt(T.startLabel,{city:n}) : n;
    startTags[n].setAttribute('text-anchor', (on && label && cand) ? (pos[n][0]<70?'start':(pos[n][0]>320?'end':'middle')) : 'middle'); });
}
let handNode=null;
function placeHand(n){ if(!n||started){hideHand();return;} const pr=$('panel').getBoundingClientRect(); const m=svg.getScreenCTM(); if(!m) return; const pt=svg.createSVGPoint(); pt.x=pos[n][0]; pt.y=pos[n][1]; const s=pt.matrixTransform(m);
  /* fingertip (≈17px from the icon's left, 6px from its top) lands on the city dot */
  hand.style.left=(s.x-pr.left-17)+'px'; hand.style.top=(s.y-pr.top+14)+'px'; hand.classList.add('on'); /* fingertip just below the dot, pointing up at it */
  handNode=n; const lbl=startTags[n]; if(lbl){ lbl.dataset.y=lbl.getAttribute('y'); lbl.setAttribute('y', pos[n][1]-18); } }
function hideHand(){ hand.classList.remove('on'); if(handNode&&startTags[handNode]&&startTags[handNode].dataset.y){ startTags[handNode].setAttribute('y', startTags[handNode].dataset.y); } handNode=null; }
function updateRoutes(){ $('chipRoutes').textContent= CITY_MODE ? fmt(T.chipCities,{done:visited.size,total:M.nodes.length}) : fmt(T.chipRoutes,{done:done.size,total:M.edges.length}); }
function remainingEdges(){ return M.edges.filter(([a,b])=>!done.has(key(a,b))); }

/* ---------------- play ---------------- */
function begin(n){
  if(finished||paused) return;
  clearT('idleHint'); clearT('idleAuto'); hideHand();                                            // RULE-CVR-004
  if(!started){ started=true; startTs=Date.now(); timerEl.style.setProperty('--dur',PLAY_LIMIT_MS+'ms'); timerEl.classList.add('run'); setT('limit', autoFinish, PLAY_LIMIT_MS); if(!firstTouch){firstTouch=Date.now(); track('first_touch',{map_id:M.id});} }
  showStartHints(false); clearHint();
  cur=n; dragging=true; nodeEls[n].classList.add('cur','done'); if(CITY_MODE){ visited=new Set([n]); updateRoutes(); }
  rubber.style.display=''; rubber.setAttribute('x1',pos[n][0]); rubber.setAttribute('y1',pos[n][1]); rubber.setAttribute('x2',pos[n][0]); rubber.setAttribute('y2',pos[n][1]);
  setCopy(T.playTitle, CITY_MODE?T.playSub:T.playSubRoutes);
}
function tryMove(n){
  if(n===cur) return;
  const k=key(cur,n); const isEdge=M.edges.some(([a,b])=>key(a,b)===k);
  if(!isEdge) return;
  if(CITY_MODE && visited.has(n)){ drop(k, n, 'repeat_city'); return; }
  if(done.has(k)){ drop(k, n, 'repeat_route'); return; }
  done.add(k); if(CITY_MODE) visited.add(n); edgeEls[k].classList.add('lit'); waveEls[k].classList.add('on');
  nodeEls[cur].classList.remove('cur'); nodeEls[cur].classList.add('done');
  cur=n; nodeEls[n].classList.add('cur'); nodeEls[n].classList.add('done');
  rubber.setAttribute('x1',pos[n][0]); rubber.setAttribute('y1',pos[n][1]);
  showLandmark(n); toast(fmt(T.toastConnected,{city:n}), null, true);
  updateRoutes(); track('route_done',{map_id:M.id,city:n,routes:done.size,cities:visited.size});
  if(isComplete()) win(false);
}
/* label avoidance: put the city name where no route runs through it (below by default, above if below is crossed) */
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy||1; const u=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/L)); return Math.hypot(px-(ax+u*dx), py-(ay+u*dy)); }
let placedLabels=[];
function labelHits(n, cx, cy){ const w=Math.max(40, n.length*7.6+8); let score=0;
  for(const b of placedLabels){ if(Math.abs(b.x-cx)<(b.w+w)/2 && Math.abs(b.y-cy)<19) score+=4; }
  for(const [a,b] of M.edges){ if(a===n||b===n) continue; for(const px of [cx-w/2, cx, cx+w/2]){ if(segDist(px,cy,pos[a][0],pos[a][1],pos[b][0],pos[b][1])<9) score+=1; } }
  for(const m of M.nodes){ if(m===n) continue; if(Math.abs(pos[m][0]-cx)<w/2+12 && Math.abs(pos[m][1]-cy)<16) score+=3; }
  return score; }
function labelSide(n){ const [x,y]=pos[n]; let side;
  if(y>500) side='above'; else if(y<40) side='below'; else { const below=labelHits(n,x,y+22), above=labelHits(n,x,y-22); side = above<below ? 'above' : 'below'; }
  placedLabels.push({x:x, y: side==='above'? y-22 : y+22, w:Math.max(40,n.length*7.6+8)}); return side; }
function showLandmark(n){ const u=$('lm_'+n); if(!u) return; u.classList.remove('show'); void u.getBBox(); u.classList.add('show'); }
function drop(k, n, reason){
  dragging=false; drops++; rubber.style.display='none';
  if(k){ edgeEls[k].classList.add('bad'); } if(n){ nodeEls[n].classList.add('bad'); }
  if(cur) nodeEls[cur].classList.remove('cur');
  toast(T.toastDrop, 'bad'); $('chipRoutes').classList.add('warn');
  track('drop',{map_id:M.id,reason,routes:done.size,drops});
  setCopy(T.dropTitle,T.dropSub);
  setT('reset', ()=>{
    Object.values(edgeEls).forEach(e=>{e.classList.remove('lit','bad','hint');});
    Object.values(waveEls).forEach(w=>w.classList.remove('on'));
    Object.values(nodeEls).forEach(c=>c.classList.remove('done','cur','bad'));
    done=new Set(); visited=new Set(); cur=null; updateRoutes(); $('chipRoutes').classList.remove('warn');
    showStartHints(true);
    if(drops>=(G.handAfterDrops||3)){ started=false; placeHand(M.startCandidates[0]); started=true; }
    if(drops>=(G.hintAfterDrops||2)){ setT('hint', showHint, 400); track('hint_shown',{map_id:M.id,drops}); }
  }, 450);
}
function showHint(){ const start=M.startCandidates[0]; const rem=remainingEdges();
  if(CITY_MODE){ const p=hamPathFrom(start,new Set([start])); if(p&&p.length>1){ edgeEls[key(p[0],p[1])].classList.add('hint'); setCopy(T.hintTitle,T.hintSub); } return; }
  for(const [a,b] of rem){ if(a!==start && b!==start) continue; const next=a===start?b:a; const k=key(a,b); const after=rem.filter(e=>key(e[0],e[1])!==k); if(canFinishFrom(next,after)){ edgeEls[k].classList.add('hint'); setCopy(T.hintTitle,T.hintSub); return; } } }
function clearHint(){ Object.values(edgeEls).forEach(e=>e.classList.remove('hint')); }
function liveHint(){ clearHint(); if(drops<(G.hintAfterDrops||2)||!cur) return; const rem=remainingEdges();
  if(CITY_MODE){ const p=hamPathFrom(cur,visited); if(p&&p.length>1) edgeEls[key(p[0],p[1])].classList.add('hint'); return; }
  for(const [a,b] of rem){ if(a!==cur && b!==cur) continue; const next=a===cur?b:a; const k=key(a,b); const after=rem.filter(e=>key(e[0],e[1])!==k); if(canFinishFrom(next,after)){ edgeEls[k].classList.add('hint'); return; } } }
function win(auto){
  finished=true; dragging=false; clearT('limit'); rubber.style.display='none'; timerEl.classList.remove('run'); clearHint(); hand.classList.remove('on');
  if(cur) nodeEls[cur].classList.remove('cur');
  Object.values(nodeEls).forEach(c=>c.classList.add('done'));
  if(CITY_MODE) Object.keys(edgeEls).forEach(k=>{ if(!done.has(k)) edgeEls[k].classList.add('fade'); });
  M.nodes.forEach((n,i)=>setTimeout(()=>showLandmark(n), i*90));
  toast(auto?T.toastAuto:(CITY_MODE?T.toastDone:T.toastDoneRoutes),'good');
  const ms=Date.now()-startTs; const vars={cities:M.nodes.length,routes:done.size,drops};
  setCopy(auto?T.autoTitle:T.winTitle, auto?T.autoSubDone:fmt(drops?T.winSubDrops:T.winSubClean,vars));
  track(auto?'auto_finish':'solved',{map_id:M.id,solve_ms:ms,drops});
  setT('end', ()=>{                                                                            // RULE-CVR-006
    $('endStat').textContent=fmt(T.endStat,vars);
    (function(s){ const el=$('endBig'); el.textContent=''; s.split(/(\*[^*]+\*)/).forEach(part=>{ if(/^\*.+\*$/.test(part)){ const em=document.createElement('em'); em.textContent=part.slice(1,-1); el.appendChild(em); } else if(part) el.appendChild(document.createTextNode(part)); }); })(auto ? T.endBigAuto : T.endBig);
    stage.classList.add('ended'); endEl.classList.add('on'); track('end_card',{map_id:M.id,auto});
  }, 1500);
}
function autoFinish(){
  if(finished||autoPlayed) return; autoPlayed=true; dragging=false; rubber.style.display='none'; clearT('idleHint'); clearT('idleAuto'); clearT('limit'); hand.classList.remove('on');
  Object.values(edgeEls).forEach(e=>e.classList.remove('lit','bad','hint')); Object.values(waveEls).forEach(w=>w.classList.remove('on'));
  Object.values(nodeEls).forEach(c=>c.classList.remove('done','cur','bad')); done=new Set(); visited=new Set(); updateRoutes(); showStartHints(false); clearHint();
  if(!started){ started=true; startTs=Date.now(); }
  const path= CITY_MODE ? hamPathFrom(M.startCandidates[0], new Set([M.startCandidates[0]])) : eulerPath(M.nodes,M.edges); setCopy(T.autoTitle,T.autoSubPlay);
  path.forEach((n,i)=>{ if(i===0){ setTimeout(()=>{cur=n; visited.add(n); nodeEls[n].classList.add('cur','done'); updateRoutes();},0); return; }
    setTimeout(()=>{ const p=path[i-1], k=key(p,n); done.add(k); visited.add(n); edgeEls[k].classList.add('lit'); waveEls[k].classList.add('on');
      nodeEls[p].classList.remove('cur'); nodeEls[n].classList.add('cur','done'); cur=n; showLandmark(n); updateRoutes();
      if(i===path.length-1) setTimeout(()=>win(true),300); }, 260*i); });
}

/* ---------------- pointer handling ---------------- */
function nodeAt(p){ let best=null,bd=HIT_R; M.nodes.forEach(n=>{const d=dist(p,pos[n]); if(d<bd){bd=d;best=n;}}); return best; }
svg.addEventListener('pointerdown', e=>{ if(finished||paused) return; const p=svgPoint(e); const n=nodeAt([p.x,p.y]); if(!n) return; svg.setPointerCapture(e.pointerId); begin(n); e.preventDefault(); });
svg.addEventListener('pointermove', e=>{ if(!dragging) return; const p=svgPoint(e); rubber.setAttribute('x2',p.x); rubber.setAttribute('y2',p.y); const n=nodeAt([p.x,p.y]); if(n) { tryMove(n); liveHint(); } });
function lift(){ if(!dragging) return; if(!isComplete()){ drop(null,null,'lift'); } }
svg.addEventListener('pointerup', lift); svg.addEventListener('pointercancel', lift);

/* ---------------- CTA (RULE-CVR-008, RULE-MRD-005/006) ---------------- */
let lastCta=0;
function clickthrough(e, src){
  const now=Date.now(); if(now-lastCta<CTA_DEBOUNCE_MS){ e.preventDefault(); return; } lastCta=now;
  track('cta_click',{map_id:M?M.id:null,source:src});
  if(Bridge.isMraid){ e.preventDefault(); Bridge.openClickthrough(CTA_URL); }
  /* outside MRAID the <a target=_blank> navigates natively (RULE-MRD-006 fallback) */
}
$('btnCta').addEventListener('click', e=>clickthrough(e,'endcard'));
$('btnCtaMini').addEventListener('click', e=>clickthrough(e,'ingame'));
$('btnNext').addEventListener('click', ()=>{ track('next_map',{from:M.id}); loadMap((mapIdx+1)%order.length); });
window.addEventListener('resize', ()=>{ fitTitle(); fitViewBox(); if(!started && M && hand.classList.contains('on')) placeHand(M.startCandidates[0]); });
window.addEventListener('orientationchange', ()=>setTimeout(fitViewBox,60));

/* ---------------- MRAID bridge (RULE-MRD-001…007) ---------------- */
const Bridge={
  isMraid:false, ready:false,
  init(){ const start=()=>{ if(window.mraid){ this.isMraid=true; try{ if(mraid.getState()==='loading'){ mraid.addEventListener('ready',()=>this.onReady()); } else this.onReady(); }catch(_){ this.onReady(); } } else this.onReady(); };
    if(window.mraid) start(); else setTimeout(start, 500); },                                  // RULE-MRD-002: wait ≤500 ms for mraid.js
  onReady(){ if(this.ready) return; this.ready=true;
    if(this.isMraid){ try{ mraid.addEventListener('viewableChange', v=>{ v?resumeAll():pauseAll(); }); mraid.addEventListener('stateChange', s=>{ if(s==='hidden') pauseAll(); else if(s==='default'||s==='expanded') resumeAll(); }); if(mraid.isViewable && !mraid.isViewable()) pauseAll(); }catch(_){} }
    document.addEventListener('visibilitychange', ()=>{ document.hidden?pauseAll():resumeAll(); });
    boot(); },
  openClickthrough(url){ if(!url) return; if(this.isMraid && typeof mraid.open==='function'){ try{ mraid.open(url); return; }catch(_){} } try{ window.open(url,'_blank','noopener'); }catch(_){ location.href=url; } }
};
window.addEventListener('pagehide', ()=>{ Object.keys(timers).forEach(clearT); });           // RULE-PRF-011 teardown

/* ---------------- boot ---------------- */
function boot(){ loadMap(0); track('impression',{maps:order.map(m=>m.id),locale:LOCALE,mraid:Bridge.isMraid}); }
window.__hf = {events, track, get map(){return M;}, solve:()=> CITY_MODE ? hamPathFrom(M.startCandidates[0], new Set([M.startCandidates[0]])) : eulerPath(M.nodes,M.edges), load:i=>loadMap(i), mode:MODE, locale:LOCALE, pause:pauseAll, resume:resumeAll};
Bridge.init();
})();
</script>
